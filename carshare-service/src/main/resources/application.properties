server.port=8080
spring.application.name=carshare-service

# Base PROPRE a ce service (H2 en memoire) - database per service
spring.datasource.url=jdbc:h2:mem:carshare;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

logging.pattern.level=%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]
