server.port=8080
spring.application.name=gateway

# Services en aval (noms Docker, port interne 8080)
upstream.rail-url=${RAIL_BRIDGE_URL:http://rail-bridge:8080}
upstream.air-url=${AIR_BRIDGE_URL:http://air-bridge:8080}
upstream.car-url=${CARSHARE_URL:http://carshare-service:8080}
upstream.reservations-url=${RESERVATIONS_URL:http://reservations-service:8080}
upstream.notifications-url=${NOTIFICATIONS_URL:http://notification-service:8080}

# Authentification (comptes de DEMO ; secret a changer hors demo)
gateway.users=demo:demo123,admin:admin123
gateway.jwt-secret=${GATEWAY_JWT_SECRET:change-me-demo-secret-change-me-demo-secret}
gateway.jwt-ttl-seconds=3600

logging.pattern.level=%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]
