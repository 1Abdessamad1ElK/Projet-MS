server.port=8080
spring.application.name=rail-bridge

# IOR publie par le serveur ferroviaire (volume partage ./ior)
rail.ior-file=${RAIL_IOR_FILE:/ior/RailBooking.ior}

# trace_id / span_id injectes par l'agent OpenTelemetry (correlation des logs)
logging.pattern.level=%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]
