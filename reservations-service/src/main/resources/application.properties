server.port=8080
spring.application.name=reservations-service

# Base PROPRE a ce service (H2 en memoire)
spring.datasource.url=jdbc:h2:mem:reservations;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# Bridges et services appeles par la saga (noms Docker, port interne 8080)
bridges.rail-url=${RAIL_BRIDGE_URL:http://rail-bridge:8080}
bridges.air-url=${AIR_BRIDGE_URL:http://air-bridge:8080}
bridges.car-url=${CARSHARE_URL:http://carshare-service:8080}
pricing.url=${PRICING_URL:http://pricing-service:8080}

# Les holds expirent a 10 min chez les operateurs : on n'entame pas la phase confirm au-dela de 8 min
saga.max-confirm-window-seconds=480

# RabbitMQ : delai de connexion court pour ne pas bloquer une reservation si le broker est down
spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2s

logging.pattern.level=%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]
